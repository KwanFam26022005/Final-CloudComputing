# Ghep voi docker-compose.yml tai goc sau khi khoi phuc volume.
# external:true yeu cau volume da ton tai de tranh tao volume rong.
services:
  authentication-identity-server:
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
    external: true
    name: n07-keycloak-data
