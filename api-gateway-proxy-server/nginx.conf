events {}

http {
  # ===========================================================================
  # UPSTREAM LOAD BALANCER (Mở rộng #10: Thuật toán Round Robin giữa 2 Web Server)
  # ===========================================================================
  upstream web_backend {
    server web-frontend-server:80;
    server web-frontend-server2:80;
  }

  server {
    listen 80;

    # 1. Web tĩnh + Load Balancing Round Robin (Cơ bản #9 & Mở rộng #10)
    location / {
      proxy_pass http://web_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Application Backend API - Strip tiền tố /api/ (Cơ bản #9)
    location /api/ {
      proxy_pass http://application-backend-server:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Route trực tiếp /student/ trỏ tới API /student của Backend (Mở rộng #9)
    location /student/ {
      proxy_pass http://application-backend-server:8081/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Authentication Identity Server - Keycloak (Cơ bản #9)
    location /auth/ {
      proxy_pass http://authentication-identity-server:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak serves its Admin Console, OIDC endpoints and assets at root paths.
    # /auth/ redirects to /admin/; these paths must stay on the same upstream.
    location ~ ^/(admin|realms|resources)(/|$) {
      proxy_pass http://authentication-identity-server:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
